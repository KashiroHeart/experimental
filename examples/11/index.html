<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#11 日付時刻翻訳 翻訳 | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<!--
  日付時刻翻訳の「翻訳」（旧 tools.yoshina.moe/tools/programming/datetime/ の翻訳モードのメイン領域を移したもの）。
  変換元・変換先の言語を設定帯の名前（折り畳み #pop_from / #pop_to）で選び、日付フォーマット文字列を翻訳する。
  言語の候補は main.js が言語の表から組み立てる。
  変換も全部 main.js の中（もとは Go のサーバー側。組み立ての #10 と同じものを持つ）。
-->
<link rel="stylesheet" href="/no.11/main.css">
</head>
<body>
<noscript>
    <p class="yt-msg yt-msg--error dt-noscript">JavaScript が無効なので使えません</p>
</noscript>

<main class="yt-tr dt-main">
    <section class="yt-tr__card dt-card" aria-label="翻訳">
        <div class="yt-tr__bar">
            <div class="yt-tr__side">
                <button type="button" id="from_name" class="yt-tr__name" data-pop="pop_from"><span id="from_label"></span><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></button>
            </div>
            <button type="button" id="swap" class="yt-iconbtn yt-tr__swap" title="入れ替え" aria-label="変換元と変換先を入れ替える"><svg class="yt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 8.5h14l-3.5-3.5M19.5 15.5h-14l3.5 3.5"/></svg></button>
            <div class="yt-tr__side yt-tr__side--out">
                <button type="button" id="to_name" class="yt-tr__name" data-pop="pop_to"><span id="to_label"></span><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></button>
            </div>
        </div>

        <div class="yt-tr__panes">
            <div class="yt-tr__pane">
                <textarea id="input" class="yt-tr__area" maxlength="1024" placeholder="変換元の書式" spellcheck="false" aria-label="変換元の書式"></textarea>
                <span class="yt-tr__corner">
                    <button type="button" id="clear" class="yt-iconbtn" aria-label="クリア" title="クリア"><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
                </span>
                <div class="yt-tr__foot">
                    <div class="yt-tr__msgs"></div>
                    <span class="yt-tr__count" id="count">0 / 1024</span>
                </div>
            </div>
            <div class="yt-tr__pane yt-tr__pane--out">
                <textarea id="output" class="yt-tr__area yt-tr__area--out" placeholder="変換先の書式" readonly aria-label="変換先の書式"></textarea>
                <div class="yt-tr__foot">
                    <div class="yt-tr__msgs" id="warns" aria-live="polite">
                        <p id="error" class="yt-msg yt-msg--error" data-icon-error></p>
                    </div>
                    <span class="yt-tr__actions">
                        <button type="button" id="share" class="yt-btn yt-btn--sm yt-btn--ghost yt-share" title="入力と設定を載せた URL をコピー"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.7 10.7l6.6-3.9M8.7 13.3l6.6 3.9"/></svg><span class="yt-btn__text">URLコピー</span></button>
                        <button type="button" id="copy" class="yt-iconbtn" aria-label="コピー" title="コピー"><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg></button>
                    </span>
                </div>
            </div>
        </div>

        <div id="pop_from" class="yt-tr__pop" role="dialog" aria-label="変換元の言語" hidden>
            <div class="yt-tr__pop-head">
                <h2 class="yt-tr__pop-title">変換元の言語</h2>
                <button type="button" class="yt-iconbtn yt-tr__close" data-pop-close aria-label="閉じる" title="閉じる"><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></button>
            </div>
            <div class="yt-tr__choices dt-langs" id="choices_from"></div>
        </div>
        <div id="pop_to" class="yt-tr__pop" role="dialog" aria-label="変換先の言語" hidden>
            <div class="yt-tr__pop-head">
                <h2 class="yt-tr__pop-title">変換先の言語</h2>
                <button type="button" class="yt-iconbtn yt-tr__close" data-pop-close aria-label="閉じる" title="閉じる"><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></button>
            </div>
            <div class="yt-tr__choices dt-langs" id="choices_to"></div>
        </div>
    </section>
</main>

<script src="/no.11/main.js"></script>
</body>
</html>
