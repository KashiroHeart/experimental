<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#3 基数変換 B 左右2ペイン | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<style>
:root{color-scheme:light}
body{margin:0;background:#fff;color:#1a1a1a;font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5}
.lbl{font-size:13px;color:#595959}
.fld{box-sizing:border-box;width:100%;border:1px solid #8c8c8c;border-radius:4px;background:#fff;color:#1a1a1a;font:inherit;padding:10px 12px;outline:none;overflow-wrap:anywhere}
.fld.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.fld::placeholder{color:#767676}
.fld:hover{border-color:#1d4ed8}
.fld:focus-visible{border-color:#1d4ed8;box-shadow:0 0 0 1px #1d4ed8}
.fld[readonly]{background:#f2f2f2}
.fld[readonly]:hover{border-color:#8c8c8c}
.fld[readonly]:focus-visible{border-color:#1d4ed8;box-shadow:0 0 0 1px #1d4ed8}
.fld[aria-invalid="true"],.fld[aria-invalid="true"]:hover,.fld[aria-invalid="true"]:focus-visible{border-color:#b42318;box-shadow:0 0 0 1px #b42318}
select.fld{height:44px;padding:0 10px;cursor:pointer}
.btn{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid #8c8c8c;border-radius:4px;background:#fff;color:#1a1a1a;font:inherit;cursor:pointer;position:relative}
.btn:hover{border-color:#1d4ed8;color:#1d4ed8;z-index:1}
.btn:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
.btn:active{background:#f2f2f2}
.btn[aria-pressed="true"]{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.btn[aria-pressed="true"]:hover{border-color:#1d4ed8;box-shadow:0 0 0 1px #1d4ed8;color:#fff}
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:4px 0 0 4px}
.seg .btn:last-child{border-radius:0 4px 4px 0}
.seg .btn + .btn{margin-left:-1px}
.chk{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:#1a1a1a;cursor:pointer}
.chk input:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
.chk:hover{color:#1d4ed8}
.msg{margin:0;min-height:20px;font-size:13px;line-height:20px;color:#b42318}
</style>
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 40px;display:flex;justify-content:center;align-items:flex-start;background:#fff">
<main style="width:100%;max-width:880px;display:flex;flex-direction:column;gap:32px">

<header style="display:flex;align-items:baseline;gap:12px">
<h1 style="margin:0;font-size:24px;font-weight:600;line-height:1.3">基数変換</h1>
<span class="lbl">Base Converter</span>
</header>

<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:24px">

<section aria-label="入力" style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<label class="lbl" for="b-inbase">入力基数 (2〜36)</label>
<select id="b-inbase" class="fld mono" style="width:104px;font-size:18px"></select>
</div>
<textarea id="b-in" class="fld mono" style="flex:1;min-height:240px;font-size:20px;line-height:1.4;resize:vertical" rows="8" spellcheck="false" autocomplete="off" placeholder="入力数値" aria-label="入力数値" aria-invalid="false" aria-describedby="b-in-msg">255</textarea>
<p id="b-in-msg" class="msg" aria-live="polite"></p>
<div style="display:flex;align-items:center;min-height:44px">
<label class="chk"><input type="checkbox" id="b-ignore" checked><span>基数にない文字を無視する</span></label>
</div>
</section>

<div style="flex:0 0 auto;align-self:center">
<button type="button" id="b-swap" class="btn" style="flex-direction:column;gap:4px;padding:12px 14px;font-size:13px">
<svg width="24" height="24" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M4 8h16M16 4l4 4-4 4M20 16H4M8 12l-4 4 4 4"></path></svg>
<span>入れ替え</span>
</button>
</div>

<section aria-label="出力" style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
<label class="lbl" for="b-outbase">出力基数 (2〜36)</label>
<select id="b-outbase" class="fld mono" style="width:104px;font-size:18px"></select>
</div>
<textarea id="b-out" class="fld mono" style="flex:1;min-height:240px;font-size:20px;line-height:1.4;resize:vertical" rows="8" readonly="readonly" spellcheck="false" placeholder="出力数値 (読み取り専用)" aria-label="出力数値 (読み取り専用)" aria-describedby="b-out-msg">FF</textarea>
<p id="b-out-msg" class="msg" aria-live="polite"></p>
<div style="display:flex;align-items:center;gap:12px;min-height:44px">
<span class="lbl">出力の英字</span>
<div class="seg" role="group" aria-label="出力の英字">
<button type="button" class="btn" id="b-lower" aria-pressed="false">小文字</button>
<button type="button" class="btn" id="b-upper" aria-pressed="true">大文字</button>
</div>
</div>
</section>

</div>
</main>
</div>
<script>
function parseBase(s) {
  const t = String(s).trim();
  if (!/^\d+$/.test(t)) return null;
  const n = Number(t);
  return n >= 2 && n <= 36 ? n : null;
}

function convert(value, inBase, outBase, ignore, upper) {
  const r = { out: '', numErr: '', inErr: '', outErr: '' };
  const bi = parseBase(inBase);
  const bo = parseBase(outBase);
  if (bi === null) r.inErr = '入力基数は 2〜36 の整数で指定してください';
  if (bo === null) r.outErr = '出力基数は 2〜36 の整数で指定してください';
  if (bi === null || bo === null) return r;

  let n = 0n;
  const B = BigInt(bi);
  let any = false;
  const bad = [];
  for (const ch of String(value).toLowerCase()) {
    const d = /^[0-9a-z]$/.test(ch) ? parseInt(ch, 36) : -1;
    if (d >= 0 && d < bi) {
      n = n * B + BigInt(d);
      any = true;
    } else if (!ignore) {
      const shown = ch === ' ' ? '空白' : ch === '\n' ? '改行' : ch.toUpperCase();
      if (!bad.includes(shown)) bad.push(shown);
    }
  }
  if (bad.length) {
    r.numErr = '基数 ' + bi + ' で使えない文字: ' + bad.join(' ');
    return r;
  }
  if (any) {
    const s = n.toString(bo);
    r.out = upper ? s.toUpperCase() : s.toLowerCase();
  }
  return r;
}

const $ = (id) => document.getElementById(id);
let upper = true;

for (const id of ['b-inbase', 'b-outbase']) {
  const sel = $(id);
  for (let i = 2; i <= 36; i++) sel.add(new Option(String(i), String(i)));
}
$('b-inbase').value = '10';
$('b-outbase').value = '16';

function render() {
  const r = convert($('b-in').value, $('b-inbase').value, $('b-outbase').value, $('b-ignore').checked, upper);
  $('b-out').value = r.out;
  $('b-in-msg').textContent = r.numErr;
  $('b-in').setAttribute('aria-invalid', String(!!r.numErr));
}

function setUpper(v) {
  upper = v;
  $('b-lower').setAttribute('aria-pressed', String(!v));
  $('b-upper').setAttribute('aria-pressed', String(v));
  render();
}

$('b-in').addEventListener('input', render);
$('b-inbase').addEventListener('change', render);
$('b-outbase').addEventListener('change', render);
$('b-ignore').addEventListener('change', render);
$('b-lower').addEventListener('click', () => setUpper(false));
$('b-upper').addEventListener('click', () => setUpper(true));
$('b-swap').addEventListener('click', () => {
  const out = $('b-out').value;
  const ib = $('b-inbase').value;
  $('b-in').value = out;
  $('b-inbase').value = $('b-outbase').value;
  $('b-outbase').value = ib;
  render();
});

render();
</script>
</body>
</html>
