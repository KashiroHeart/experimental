<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#9 カラーピッカー | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<!--
  カラーピッカー（旧 tools.yoshina.moe/tools/colorpicker/ のメイン領域を移したもの）。
  左に画像（スポイト・頻出色）、右に色のパネル（現在色と HSV・パレット・画像への合成）。
  画像はブラウザの中だけで扱い、サーバーへは送らない。計算も全部 main.js の中。
-->
<link rel="stylesheet" href="/no.9/main.css">
</head>
<body>
<noscript>
    <p class="yt-msg yt-msg--error cp-noscript">JavaScript が無効なので使えません</p>
</noscript>

<main class="cp-main" id="cp_main">
    <div class="cp-col cp-col--image">
        <div class="yt-io__head">
            <span class="yt-io__label">画像</span>
            <span class="yt-io__count" id="cp_image_info"></span>
            <span class="yt-io__actions">
                <button type="button" id="cp_remove" class="yt-iconbtn" aria-label="画像を除去" title="除去" hidden><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </span>
        </div>
        <label class="cp-drop" id="cp_drop">
            <input type="file" id="cp_file" class="cp-file" accept="image/*">
            <canvas id="cp_canvas" class="cp-canvas" hidden></canvas>
            <span class="cp-drop__hint" id="cp_drop_hint">画像を選択</span>
        </label>
        <p class="yt-msg yt-msg--info" data-icon-info>アップロードした画像がサーバーに送信されることはありません。</p>

        <div class="cp-sample" role="radiogroup" aria-label="サンプル範囲">
            <span class="yt-label cp-sample__label">サンプル範囲</span>
            <label class="yt-radio">
                <input type="radio" name="cp_sample" value="1" checked>
                <span class="yt-radio__box"></span>
                <span>1px</span>
            </label>
            <label class="yt-radio">
                <input type="radio" name="cp_sample" value="3">
                <span class="yt-radio__box"></span>
                <span>3×3</span>
            </label>
            <label class="yt-radio">
                <input type="radio" name="cp_sample" value="5">
                <span class="yt-radio__box"></span>
                <span>5×5</span>
            </label>
            <span class="cp-hover" id="cp_hover" aria-live="off">
                <span class="cp-hover__sw" id="cp_hover_sw"></span>
                <span class="cp-hover__hex" id="cp_hover_hex"></span>
            </span>
        </div>

        <div class="yt-io__head">
            <span class="yt-io__label">頻出色</span>
        </div>
        <div id="cp_frequent" class="cp-chips" role="group" aria-label="頻出色"></div>
    </div>

    <div class="cp-col cp-col--color yt-panel">
        <section class="yt-panel__sec">
            <div class="yt-panel__head">
                <h3 class="yt-panel__title">現在色</h3>
                <span class="cp-actions">
                    <button type="button" id="cp_hold" class="yt-btn yt-btn--sm yt-btn--ghost"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span class="yt-btn__text">パレットに追加</span></button>
                    <button type="button" id="cp_copy" class="yt-iconbtn yt-iconbtn--sm" aria-label="HEX をコピー" title="コピー"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg></button>
                </span>
            </div>
            <div class="cp-current">
                <button type="button" id="cp_current_sw" class="cp-current__sw" title="パレットに追加" aria-label="パレットに追加"></button>
                <div class="cp-current__values">
                    <label class="cp-current__hex">HEX
                        <input type="text" id="cp_hex" class="yt-input yt-input--data" maxlength="7" spellcheck="false" autocomplete="off">
                    </label>
                    <span class="cp-current__rgb" id="cp_rgb"></span>
                    <span class="cp-current__hsv" id="cp_hsv_text"></span>
                </div>
            </div>
            <div class="cp-hsv">
                <label class="cp-hsv__row">
                    <span>H</span>
                    <input type="range" id="cp_h" min="0" max="360" step="1">
                    <output></output>
                </label>
                <label class="cp-hsv__row">
                    <span>S</span>
                    <input type="range" id="cp_s" min="0" max="100" step="1">
                    <output></output>
                </label>
                <label class="cp-hsv__row">
                    <span>V</span>
                    <input type="range" id="cp_v" min="0" max="100" step="1">
                    <output></output>
                </label>
            </div>
            <p class="yt-msg yt-msg--info" data-icon-info id="cp_current_note" aria-live="polite"></p>
        </section>

        <section class="yt-panel__sec">
            <div class="yt-panel__head">
                <h3 class="yt-panel__title">パレット</h3>
                <span class="cp-actions">
                    <button type="button" id="cp_palette_copy" class="yt-iconbtn yt-iconbtn--sm" aria-label="HEX 一覧をコピー" title="コピー"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg></button>
                    <button type="button" id="cp_palette_save" class="yt-iconbtn yt-iconbtn--sm" aria-label="画像で保存" title="保存"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4.5v10.5M7.5 10.5l4.5 4.5 4.5-4.5M5 19.5h14"/></svg></button>
                    <button type="button" id="cp_palette_clear" class="yt-btn yt-btn--sm yt-btn--ghost"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h14M10 7V5h4v2M7 7l1 12.5h8L17 7"/></svg><span class="yt-btn__text">クリア</span></button>
                </span>
            </div>
            <div id="cp_palette" class="cp-chips" role="group" aria-label="パレット"></div>
            <p class="yt-msg yt-msg--info" data-icon-info id="cp_palette_note" aria-live="polite"></p>
        </section>

        <!-- 合成：画像に色を乗せる（適用）か、乗せた層を外して下地に戻す（逆算）。計算は C.blendTables。 -->
        <section class="yt-panel__sec cp-image-blend">
            <div class="yt-panel__head">
                <h3 class="yt-panel__title">合成</h3>
                <button type="button" id="cp_image_save" class="yt-iconbtn yt-iconbtn--sm" aria-label="表示中の画像を保存" title="保存" disabled><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4.5v10.5M7.5 10.5l4.5 4.5 4.5-4.5M5 19.5h14"/></svg></button>
            </div>
            <label class="yt-check">
                <input type="checkbox" id="cp_image_blend" disabled>
                <span class="yt-check__box"><svg class="yt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
                <span>画像にかける</span>
            </label>
            <div class="cp-blend-controls">
                <label class="yt-field">
                    <span class="yt-label">モード</span>
                    <select id="cp_mode" class="yt-select">
                        <option value="screen">スクリーン</option>
                        <option value="overlay">オーバーレイ</option>
                    </select>
                </label>
                <label class="yt-field cp-blend-opacity">
                    <span class="yt-label">不透明度</span>
                    <span class="cp-blend-opacity__row">
                        <input type="range" id="cp_opacity" min="0" max="100" step="1" value="100">
                        <output></output>
                    </span>
                </label>
            </div>
            <div class="cp-slots">
                <div class="cp-slot" data-slot="layer">
                    <button type="button" class="cp-slot__sw" title="現在色にする" aria-label="合成色を現在色にする"></button>
                    <span class="cp-slot__name">合成色</span>
                    <input type="text" class="yt-input yt-input--data cp-slot__hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="合成色の HEX">
                    <button type="button" class="yt-btn yt-btn--sm yt-btn--ghost cp-slot__take">現在色を入れる</button>
                </div>
            </div>
            <div class="cp-blend-dir" role="radiogroup" aria-label="画像の向き">
                <label class="yt-radio">
                    <input type="radio" name="cp_image_direction" value="apply" checked>
                    <span class="yt-radio__box"></span>
                    <span>適用</span>
                </label>
                <label class="yt-radio">
                    <input type="radio" name="cp_image_direction" value="undo">
                    <span class="yt-radio__box"></span>
                    <span>逆算</span>
                </label>
            </div>
            <p class="yt-msg yt-msg--warn" data-icon-warn id="cp_image_warn" aria-live="polite"></p>
        </section>
    </div>
</main>

<script type="module" src="/no.9/main.js"></script>
</body>
</html>
