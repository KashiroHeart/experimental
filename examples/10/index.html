<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#10 日付時刻翻訳 組み立て | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<!--
  日付時刻翻訳の「組み立て」（旧 tools.yoshina.moe/tools/programming/datetime/ の組み立てモードのメイン領域を移したもの）。
  部品ボタン（Alt＋キーでも入る）で「年」「月」などのチップを入力欄（contenteditable）に挿し、下の表に言語ごとの書式を出す。
  チップを押すと種類の候補（#chip_pop）が出る。部品ボタン・候補・表は main.js が部品と言語の表から組み立てる。
  変換も全部 main.js の中（もとは Go のサーバー側。翻訳の #11 と同じものを持つ）。
-->
<link rel="stylesheet" href="/no.10/main.css">
</head>
<body>
<noscript>
    <p class="yt-msg yt-msg--error dt-noscript">JavaScript が無効なので使えません</p>
</noscript>

<main class="yt-tr dt-main">
    <section class="yt-tr__card dt-card" aria-label="組み立て">
        <div class="yt-tr__bar dt-parts" id="parts">
            <span class="yt-tip yt-tip--left dt-parts__tip">
                <button type="button" class="yt-iconbtn" aria-label="部品の入れ方" aria-describedby="tip_parts"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.25M12 7.75v.01"/></svg></button>
                <span role="tooltip" id="tip_parts" class="yt-tip__body"></span>
            </span>
        </div>

        <div class="dt-editor-pane">
            <div id="editor" class="yt-tr__area dt-editor" contenteditable="true" role="textbox" spellcheck="false" aria-label="組み立てる書式" data-placeholder="部品と文字"></div>
            <span class="yt-tr__corner">
                <button type="button" id="clear" class="yt-iconbtn" aria-label="クリア" title="クリア"><svg class="yt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </span>
        </div>
        <div class="yt-tr__foot">
            <div class="yt-tr__msgs">
                <p id="error" class="yt-msg yt-msg--error" data-icon-error aria-live="polite"></p>
            </div>
            <span class="yt-tr__count" id="count">0 / 1024</span>
            <span class="yt-tr__actions">
                <button type="button" id="share" class="yt-btn yt-btn--sm yt-btn--ghost yt-share" title="入力を載せた URL をコピー"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.7 10.7l6.6-3.9M8.7 13.3l6.6 3.9"/></svg><span class="yt-btn__text">URLコピー</span></button>
            </span>
        </div>

        <!-- チップの種類の候補。部品ごとの組（.dt-variants）は main.js が足し、押したチップの部品の組だけを出す。 -->
        <div id="chip_pop" class="dt-chippop" role="dialog" aria-label="部品の種類" hidden>
            <div class="dt-chippop__foot">
                <button type="button" id="chip_delete" class="yt-btn yt-btn--sm yt-btn--ghost"><svg class="yt-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h14M10 7V5h4v2M7 7l1 12.5h8L17 7"/></svg><span>削除</span></button>
            </div>
        </div>
    </section>

    <div class="dt-tablewrap">
        <table class="yt-table dt-table">
            <thead>
                <tr><th scope="col">言語</th><th scope="col">書式</th><th scope="col"><span class="dt-visually-hidden">コピー</span></th></tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</main>

<script src="/no.10/main.js"></script>
</body>
</html>
