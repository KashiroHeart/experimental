<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#2 基数変換 A 縦積み | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="stylesheet" href="/no.2/main.css">
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 24px;display:flex;justify-content:center;align-items:flex-start;background:#fff">
<main style="width:100%;max-width:560px;display:flex;flex-direction:column;gap:24px">

<header style="display:flex;align-items:baseline;gap:12px">
<h1 style="margin:0;font-size:24px;font-weight:600;line-height:1.3">基数変換</h1>
<span class="lbl">Base Converter</span>
</header>

<section aria-label="入力" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px">
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="a-inbase">入力基数 (2〜36)</label>
<input id="a-inbase" class="fld mono" style="width:96px;text-align:center;font-size:18px" type="text" inputmode="numeric" autocomplete="off" value="10" aria-invalid="false">
</div>
<label class="chk"><input type="checkbox" id="a-ignore" checked><span>基数にない文字を無視する</span></label>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="a-in">入力数値</label>
<textarea id="a-in" class="fld mono" style="font-size:20px;line-height:1.4;resize:vertical" rows="2" spellcheck="false" autocomplete="off" placeholder="数値を入力" aria-invalid="false" aria-describedby="a-in-msg">255</textarea>
</div>
<p id="a-in-msg" class="msg" aria-live="polite"></p>
</section>

<div style="display:flex;align-items:center;gap:16px">
<div style="flex:1;height:1px;background:#d9d9d9"></div>
<button type="button" id="a-swap" class="btn">
<svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"></path></svg>
<span>入れ替え</span>
</button>
<div style="flex:1;height:1px;background:#d9d9d9"></div>
</div>

<section aria-label="出力" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px">
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="a-outbase">出力基数 (2〜36)</label>
<input id="a-outbase" class="fld mono" style="width:96px;text-align:center;font-size:18px" type="text" inputmode="numeric" autocomplete="off" value="16" aria-invalid="false">
</div>
<div style="display:flex;align-items:center;gap:12px">
<span class="lbl">出力の英字</span>
<div class="seg" role="group" aria-label="出力の英字">
<button type="button" class="btn" id="a-lower" aria-pressed="false">小文字</button>
<button type="button" class="btn" id="a-upper" aria-pressed="true">大文字</button>
</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="a-out">出力数値 (読み取り専用)</label>
<textarea id="a-out" class="fld mono" style="font-size:20px;line-height:1.4;resize:vertical" rows="2" readonly="readonly" spellcheck="false" placeholder="結果" aria-describedby="a-out-msg">FF</textarea>
</div>
<p id="a-out-msg" class="msg" aria-live="polite"></p>
</section>

</main>
</div>
<script src="/no.2/main.js"></script>
</body>
</html>
