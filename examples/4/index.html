<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#4 基数変換 C 基数バー | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="stylesheet" href="/no.4/main.css">
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 24px;display:flex;justify-content:center;align-items:flex-start;background:#fff">
<main style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px">

<header style="display:flex;align-items:baseline;gap:12px">
<h1 style="margin:0;font-size:24px;font-weight:600;line-height:1.3">基数変換</h1>
<span class="lbl">Base Converter</span>
</header>

<section aria-label="基数" style="display:flex;flex-direction:column;gap:4px">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:16px 32px;padding:20px 0 12px;border-top:1px solid #d9d9d9;border-bottom:1px solid #d9d9d9">

<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<label class="lbl" for="c-inbase">入力基数 (2〜36)</label>
<div style="display:flex;align-items:center;gap:8px">
<button type="button" id="c-inbase-dec" class="btn sq" aria-label="入力基数を 1 減らす">−</button>
<input id="c-inbase" class="fld mono" style="width:88px;height:56px;padding:0 8px;text-align:center;font-size:30px" type="text" inputmode="numeric" autocomplete="off" value="10" aria-invalid="false" aria-describedby="c-bar-msg">
<button type="button" id="c-inbase-inc" class="btn sq" aria-label="入力基数を 1 増やす">+</button>
</div>
</div>

<div style="margin-bottom:6px">
<button type="button" id="c-swap" class="btn">
<svg width="20" height="20" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M4 8h16M16 4l4 4-4 4M20 16H4M8 12l-4 4 4 4"></path></svg>
<span>入れ替え</span>
</button>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<label class="lbl" for="c-outbase">出力基数 (2〜36)</label>
<div style="display:flex;align-items:center;gap:8px">
<button type="button" id="c-outbase-dec" class="btn sq" aria-label="出力基数を 1 減らす">−</button>
<input id="c-outbase" class="fld mono" style="width:88px;height:56px;padding:0 8px;text-align:center;font-size:30px" type="text" inputmode="numeric" autocomplete="off" value="16" aria-invalid="false" aria-describedby="c-bar-msg">
<button type="button" id="c-outbase-inc" class="btn sq" aria-label="出力基数を 1 増やす">+</button>
</div>
</div>

</div>
<p id="c-bar-msg" class="msg" style="text-align:center" aria-live="polite"></p>
</section>

<section aria-label="数値" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="c-in">入力数値</label>
<textarea id="c-in" class="fld mono" style="font-size:20px;line-height:1.4;resize:vertical" rows="2" spellcheck="false" autocomplete="off" placeholder="数値を入力" aria-invalid="false" aria-describedby="c-in-msg">255</textarea>
<p id="c-in-msg" class="msg" aria-live="polite"></p>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="c-out">出力数値 (読み取り専用)</label>
<textarea id="c-out" class="fld mono" style="font-size:20px;line-height:1.4;resize:vertical" rows="2" readonly="readonly" spellcheck="false" placeholder="結果">FF</textarea>
</div>
</section>

<section aria-label="オプション" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 32px;padding-top:12px;border-top:1px solid #d9d9d9">
<label class="chk"><input type="checkbox" id="c-ignore" checked><span>基数にない文字を無視する</span></label>
<div style="display:flex;align-items:center;gap:12px;min-height:44px">
<span class="lbl">出力の英字</span>
<div class="seg" role="group" aria-label="出力の英字">
<button type="button" class="btn" id="c-lower" aria-pressed="false">小文字</button>
<button type="button" class="btn" id="c-upper" aria-pressed="true">大文字</button>
</div>
</div>
</section>

</main>
</div>
<script src="/no.4/main.js"></script>
</body>
</html>
